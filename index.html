<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraCare - Medical Eye-Tracking Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include WebGazer.js for Real Pupil/Eye Tracking -->
    <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
    <style>
        .dwell-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 6px;
            background-color: #3b82f6;
            width: 0%;
            transition: width linear;
        }
        .active-dwell .dwell-progress {
            width: 100%;
            transition-duration: 1.5s;
        }
        .gaze-target.hovered {
            outline: 4px solid #2563eb;
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col justify-between select-none overflow-hidden">

    <!-- Top Status Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-8 py-4 flex justify-between items-center shadow-md z-50">
        <div class="flex items-center space-x-3">
            <div id="tracking-status-dot" class="w-4 h-4 rounded-full bg-amber-500 animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wide text-white">AuraCare <span id="tracking-text" class="text-xs font-normal text-amber-300 bg-slate-700 px-2 py-1 rounded ml-2">Initializing Camera...</span></h1>
        </div>
        <div class="flex items-center space-x-6 text-sm text-slate-300">
            <div>Patient: <span class="font-semibold text-white">John Doe (Room 302-B)</span></div>
            <div id="clock" class="font-mono bg-slate-900 px-3 py-1 rounded border border-slate-700">00:00:00</div>
        </div>
    </header>

    <!-- Main Dynamic Screen Container -->
    <main id="main-container" class="flex-1 p-8 flex flex-col justify-center items-center relative">
        <div class="text-center">
            <h2 class="text-2xl font-bold mb-4">Please grant webcam access for eye-tracking</h2>
            <p class="text-slate-400">The system is calibrating your pupil coordinates...</p>
        </div>
    </main>

    <!-- Footer Guide Bar -->
    <footer class="bg-slate-800 border-t border-slate-700 px-8 py-3 text-center text-sm text-slate-400 flex justify-between items-center z-50">
        <div>💡 <span class="text-slate-200 font-medium">Instruction:</span> Look at any option for 1.5 seconds with your eyes to choose it.</div>
        <div id="status-alert" class="text-emerald-400 font-medium">System operational.</div>
    </footer>

    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        let dwellTimer = null;
        let currentHoveredElement = null;
        const audioAlarm = document.getElementById('alert-sound');

        // Initialize WebGazer Eye Tracker
        window.onload = function() {
            webgazer.setGazeListener(function(data, elapsedTime) {
                if (data == null) return;
                
                // data.x and data.y represent estimated pupil/gaze coordinates on screen
                let x = data.x;
                let y = data.y;
                
                // Find element under gaze coordinates
                let elem = document.elementFromPoint(x, y);
                let target = elem ? elem.closest('.gaze-target') : null;

                handleGazeTarget(target);
            }).begin();

            // Customize WebGazer layout UI elements (hide unnecessary debug boxes)
            webgazer.showVideoPreview(true).showPredictionPoints(true);
            
            setTimeout(() => {
                // Hide setup video preview box after 4 seconds for clean UI appearance
                try {
                    webgazer.showVideoPreview(false);
                } catch(e) {}
                
                document.getElementById('tracking-status-dot').className = "w-4 h-4 rounded-full bg-emerald-500";
                document.getElementById('tracking-text').className = "text-xs font-normal text-emerald-300 bg-slate-700 px-2 py-1 rounded ml-2";
                document.getElementById('tracking-text').innerText = "Eye-Tracking Active";
                renderMainScreen();
            }, 4000);
        };

        // Gaze Dwell Logic
        function handleGazeTarget(target) {
            if (target === currentHoveredElement) return;

            // Clear previous target dwell
            if (currentHoveredElement) {
                currentHoveredElement.classList.remove('active-dwell', 'hovered');
                clearTimeout(dwellTimer);
            }

            currentHoveredElement = target;

            // Start dwell timer on new target
            if (currentHoveredElement) {
                const optionType = currentHoveredElement.getAttribute('data-action');
                currentHoveredElement.classList.add('active-dwell', 'hovered');
                
                dwellTimer = setTimeout(() => {
                    selectOption(optionType);
                    currentHoveredElement = null;
                }, 1500); // 1.5 seconds gaze selection time
            }
        }

        // Render Main Screen Options
        function renderMainScreen() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="w-full max-w-5xl text-center mb-6">
                    <h2 class="text-3xl font-bold text-white mb-2">Select Your Need</h2>
                    <p class="text-slate-400">Keep your eyes focused on an option for 1.5 seconds</p>
                </div>
                <div class="grid grid-cols-2 gap-8 w-full max-w-4xl h-[55vh]">
                    <div data-action="nurse" class="gaze-target relative overflow-hidden bg-slate-800 border-2 border-slate-700 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all">
                        <div class="text-6xl mb-4">👩‍⚕️</div>
                        <h3 class="text-2xl font-bold text-white">Call Nurse</h3>
                        <p class="text-sm text-slate-400 mt-1">Notify nursing station & request assistance</p>
                        <div class="dwell-progress"></div>
                    </div>

                    <div data-action="bed" class="gaze-target relative overflow-hidden bg-slate-800 border-2 border-slate-700 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all">
                        <div class="text-6xl mb-4">🛏️</div>
                        <h3 class="text-2xl font-bold text-white">Adjust Bed Position</h3>
                        <p class="text-sm text-slate-400 mt-1">Send position adjustment alert to family</p>
                        <div class="dwell-progress"></div>
                    </div>

                    <div data-action="bathroom" class="gaze-target relative overflow-hidden bg-slate-800 border-2 border-slate-700 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all">
                        <div class="text-6xl mb-4">🚻</div>
                        <h3 class="text-2xl font-bold text-white">Bathroom Emergency</h3>
                        <p class="text-sm text-slate-400 mt-1">Immediate distress alert to everyone</p>
                        <div class="dwell-progress"></div>
                    </div>

                    <div data-action="entertainment" class="gaze-target relative overflow-hidden bg-slate-800 border-2 border-slate-700 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all">
                        <div class="text-6xl mb-4">📺</div>
                        <h3 class="text-2xl font-bold text-white">Entertainment</h3>
                        <p class="text-sm text-slate-400 mt-1">Watch TV, Movies, Social Media & More</p>
                        <div class="dwell-progress"></div>
                    </div>
                </div>
            `;
        }

        function selectOption(type) {
            clearTimeout(dwellTimer);
            if (type === 'nurse') triggerNurseCall();
            else if (type === 'bed') triggerBedAlert();
            else if (type === 'bathroom') triggerBathroomEmergency();
            else if (type === 'entertainment') renderEntertainmentScreen();
        }

        // 1. Nurse Call Flow
        function triggerNurseCall() {
            audioAlarm.loop = true;
            audioAlarm.play().catch(e => console.log("Audio restriction"));
            document.getElementById('status-alert').innerText = "⚠️ NURSE ALERT SENT to Phone (+1 555-0199) & Alarm Active";
            document.getElementById('status-alert').className = "text-red-400 font-bold animate-pulse";

            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-2xl w-full text-center shadow-2xl">
                    <div class="text-5xl mb-4">🚨</div>
                    <h2 class="text-3xl font-bold text-white mb-2">Nurse Called Successfully</h2>
                    <p class="text-slate-300 mb-6">Alarm is ringing. Waiting for nurse response...</p>
                    <div class="bg-slate-900 p-4 rounded-xl mb-6 border border-slate-700">
                        <p class="text-sm text-slate-400 mb-2">Simulate Nurse Response:</p>
                        <button onclick="nurseAcceptedFlow()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2 rounded-lg transition">
                            Simulate [Nurse Accepted Call]
                        </button>
                    </div>
                    <button onclick="resetToHome()" class="text-slate-400 hover:text-white underline text-sm">Cancel / Return Home</button>
                </div>
            `;
        }

        function nurseAcceptedFlow() {
            audioAlarm.pause();
            audioAlarm.currentTime = 0;
            document.getElementById('status-alert').innerText = "✅ Nurse Connected. Choose requirement:";
            
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="w-full max-w-4xl text-center mb-6">
                    <h2 class="text-3xl font-bold text-white mb-2">Nurse is Connected</h2>
                    <p class="text-slate-400">Gaze at YES, NO, or Call Doctor</p>
                </div>
                <div class="grid grid-cols-3 gap-6 w-full max-w-3xl mb-8">
                    <div data-action="res-yes" onclick="sendNurseResponse('YES')" class="gaze-target bg-emerald-800 border-2 border-emerald-600 p-8 rounded-2xl flex flex-col items-center justify-center cursor-pointer relative overflow-hidden">
                        <span class="text-4xl mb-2">✅</span><h3 class="text-2xl font-bold text-white">YES</h3><div class="dwell-progress"></div>
                    </div>
                    <div data-action="res-no" onclick="sendNurseResponse('NO')" class="gaze-target bg-rose-800 border-2 border-rose-600 p-8 rounded-2xl flex flex-col items-center justify-center cursor-pointer relative overflow-hidden">
                        <span class="text-4xl mb-2">❌</span><h3 class="text-2xl font-bold text-white">NO</h3><div class="dwell-progress"></div>
                    </div>
                    <div data-action="res-doc" onclick="sendNurseResponse('DOCTOR')" class="gaze-target bg-blue-800 border-2 border-blue-600 p-8 rounded-2xl flex flex-col items-center justify-center cursor-pointer relative overflow-hidden">
                        <span class="text-4xl mb-2">👨‍⚕️</span><h3 class="text-xl font-bold text-white">Call Doctor</h3><div class="dwell-progress"></div>
                    </div>
                </div>
                <button onclick="resetToHome()" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-lg">Return to Main Menu</button>
            `;
        }

        function sendNurseResponse(ans) {
            alert(`Message sent to nurse terminal: Patient replied -> ${ans}`);
            resetToHome();
        }

        // 2. Adjust Bed Position Flow
        function triggerBedAlert() {
            audioAlarm.play(); setTimeout(() => audioAlarm.pause(), 1000);
            document.getElementById('status-alert').innerText = "📱 Bed Adjustment Alert sent to family.";
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-xl w-full text-center shadow-2xl">
                    <div class="text-5xl mb-4">🛏️</div>
                    <h2 class="text-2xl font-bold text-white mb-2">Bed Position Request Sent</h2>
                    <button onclick="resetToHome()" class="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-xl">Back to Home</button>
                </div>
            `;
        }

        // 3. Bathroom Emergency Flow
        function triggerBathroomEmergency() {
            audioAlarm.loop = true; audioAlarm.play();
            document.getElementById('status-alert').innerText = "🚨 EMERGENCY: Bathroom Assistance Requested!";
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="bg-red-950 border-2 border-red-600 p-8 rounded-2xl max-w-xl w-full text-center shadow-2xl animate-pulse">
                    <div class="text-6xl mb-4">🚨</div>
                    <h2 class="text-3xl font-bold text-red-100 mb-2">BATHROOM EMERGENCY ALERT</h2>
                    <button onclick="resetToHome()" class="mt-6 bg-white text-red-900 font-bold px-8 py-3 rounded-xl">Acknowledge & Clear</button>
                </div>
            `;
        }

        // 4. Entertainment Flow (4 Directional Options)
        function renderEntertainmentScreen() {
            document.getElementById('status-alert').innerText = "📺 Entertainment Menu Active";
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="w-full max-w-5xl text-center mb-4">
                    <h2 class="text-3xl font-bold text-white">Entertainment Center</h2>
                </div>
                <div class="relative w-full max-w-3xl h-[55vh] flex items-center justify-center">
                    <div data-action="tv" onclick="selectMedia('Watch TV')" class="gaze-target absolute top-0 left-1/2 -translate-x-1/2 bg-slate-800 border-2 border-slate-700 w-64 h-32 rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                        <span class="text-3xl">📺</span><span class="font-bold text-lg mt-1">Watch TV</span><div class="dwell-progress"></div>
                    </div>
                    <div data-action="movies" onclick="selectMedia('Watch Movies')" class="gaze-target absolute left-0 top-1/2 -translate-y-1/2 bg-slate-800 border-2 border-slate-700 w-64 h-32 rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                        <span class="text-3xl">🍿</span><span class="font-bold text-lg mt-1">Watch Movies</span><div class="dwell-progress"></div>
                    </div>
                    <div data-action="insta" onclick="selectMedia('Open Instagram')" class="gaze-target absolute right-0 top-1/2 -translate-y-1/2 bg-slate-800 border-2 border-slate-700 w-64 h-32 rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                        <span class="text-3xl">📸</span><span class="font-bold text-lg mt-1">Open Instagram</span><div class="dwell-progress"></div>
                    </div>
                    <div data-action="music" onclick="selectMedia('Listen to Music')" class="gaze-target absolute bottom-0 left-1/2 -translate-x-1/2 bg-slate-800 border-2 border-slate-700 w-64 h-32 rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                        <span class="text-3xl">🎵</span><span class="font-bold text-lg mt-1">Listen to Music</span><div class="dwell-progress"></div>
                    </div>
                </div>
                <div class="mt-4"><button onclick="resetToHome()" class="bg-slate-700 text-white px-6 py-2 rounded-lg text-sm">Back to Main Menu</button></div>
            `;
        }

        function selectMedia(name) { alert(`Launching: ${name}`); resetToHome(); }
        function resetToHome() {
            audioAlarm.pause(); audioAlarm.currentTime = 0;
            document.getElementById('status-alert').innerText = "System operational. Eye tracking active.";
            document.getElementById('status-alert').className = "text-emerald-400 font-medium";
            renderMainScreen();
        }
    </script>
</body>
</html>
