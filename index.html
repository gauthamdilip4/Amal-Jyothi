<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroGesture - Low-Cost Assistive Communication</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    header { padding: 1rem 2rem; background: #1e293b; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; }
    .badge { background: #0284c7; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.85rem; font-weight: bold; }
    
    .container { display: flex; flex: 1; position: relative; }
    .camera-panel { width: 320px; background: #1e293b; p: 1rem; display: flex; flex-direction: column; gap: 1rem; align-items: center; border-right: 2px solid #334155; }
    video { display: none; }
    canvas { width: 280px; height: 210px; background: #000; border-radius: 12px; border: 2px solid #38bdf8; }
    
    .status-card { width: 100%; background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid #334155; font-size: 0.9rem; }
    .status-card p { margin-bottom: 0.5rem; }
    
    .main-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
    
    /* Radial Menu Structure */
    .radial-container { position: relative; width: 450px; height: 450px; border-radius: 50%; border: 2px dashed #475569; display: flex; justify-content: center; align-items: center; }
    .menu-node { position: absolute; width: 130px; height: 130px; border-radius: 50%; background: #1e293b; border: 3px solid #0284c7; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 1.1rem; transition: all 0.2s ease; cursor: pointer; text-align: center; }
    
    /* Radial Positioning */
    .node-top { top: 10px; }
    .node-right { right: 10px; }
    .node-bottom { bottom: 10px; }
    .node-left { left: 10px; }
    
    .menu-node.active { background: #0284c7; transform: scale(1.15); box-shadow: 0 0 25px #0369a1; border-color: #38bdf8; }
    
    .center-hub { width: 120px; height: 120px; border-radius: 50%; background: #0f172a; border: 3px solid #38bdf8; display: flex; justify-content: center; align-items: center; flex-direction: column; font-size: 0.8rem; text-align: center; }
    
    .alert-banner { position: absolute; top: 20px; background: #dc2626; color: white; padding: 1rem 2rem; border-radius: 8px; font-weight: bold; display: none; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <header>
    <h1>NeuroGesture <span style="font-size: 0.9rem; color: #38bdf8;">Assistive Web Suite</span></h1>
    <span class="badge">AAC Gaze Controller</span>
  </header>

  <div class="container">
    <div class="camera-panel">
      <video id="input_video" autoplay playsinline></video>
      <canvas id="output_canvas"></canvas>
      
      <div class="status-card">
        <p><strong>Status:</strong> <span id="sys_status" style="color: #facc15;">Initializing AI...</span></p>
        <p><strong>EAR Index:</strong> <span id="ear_val">0.00</span></p>
        <p><strong>Gaze Vector:</strong> <span id="gaze_dir">CENTER</span></p>
      </div>
      
      <button onclick="triggerEmergency()" style="background: #dc2626; color: white; border: none; padding: 0.75rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;">Emergency Siren Test</button>
    </div>

    <div class="main-stage">
      <div id="alert_box" class="alert-banner">EMERGENCY ALERT ISSUED TO NURSE STATION</div>
      
      <div class="radial-container">
        <div class="menu-node node-top" id="opt_top">💧 Water</div>
        <div class="menu-node node-right" id="opt_right">⚡ Pain</div>
        <div class="menu-node node-bottom" id="opt_bottom">🚨 Call Nurse</div>
        <div class="menu-node node-left" id="opt_left">🛏️ Adjust Bed</div>
        
        <div class="center-hub">
          <span>Targeting</span>
          <strong id="active_target">None</strong>
        </div>
      </div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    
    let activeSelection = null;
    let blinkTimer = 0;
    let isBlinking = false;

    // Web Speech API Synthesis Initializer
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function triggerEmergency() {
      document.getElementById('alert_box').style.display = 'block';
      speakText("Emergency alert! Immediate assistance requested.");
      setTimeout(() => { document.getElementById('alert_box').style.display = 'none'; }, 4000);
    }

    // MediaPipe Landmark Mesh Callback Processing
    function onResults(results) {
      document.getElementById('sys_status').innerText = "Live Mesh Tracking";
      document.getElementById('sys_status').style.color = "#4ade80";

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // EAR calculation logic using left eyelid landmarks
        const p2 = landmarks[160], p6 = landmarks[144];
        const p3 = landmarks[158], p5 = landmarks[153];
        const p1 = landmarks[33],  p4 = landmarks[133];

        const dist1 = Math.hypot(p2.x - p6.x, p2.y - p6.y);
        const dist2 = Math.hypot(p3.x - p5.x, p3.y - p5.y);
        const distHoriz = Math.hypot(p1.x - p4.x, p1.y - p4.y);
        
        const ear = (dist1 + dist2) / (2.0 * distHoriz);
        document.getElementById('ear_val').innerText = ear.toFixed(2);

        // Iris Relative Coordinate Detection (Normalized Horizontal Gaze)
        const leftIris = landmarks[468];
        const irisRelX = (leftIris.x - p1.x) / distHoriz;
        
        let direction = "CENTER";
        if (irisRelX < 0.42) direction = "RIGHT";
        else if (irisRelX > 0.58) direction = "LEFT";
        else if (leftIris.y < p1.y - 0.01) direction = "TOP";
        else if (leftIris.y > p1.y + 0.02) direction = "BOTTOM";

        document.getElementById('gaze_dir').innerText = direction;
        highlightNode(direction);

        // Blink Detection (Long Blink > 400ms triggers action)
        if (ear < 0.18) {
          if (!isBlinking) {
            blinkTimer = Date.now();
            isBlinking = true;
          } else if (Date.now() - blinkTimer > 400) {
            executeCommand(direction);
            isBlinking = false;
          }
        } else {
          isBlinking = false;
        }
      }
      canvasCtx.restore();
    }

    function highlightNode(dir) {
      document.querySelectorAll('.menu-node').forEach(el => el.classList.remove('active'));
      document.getElementById('active_target').innerText = dir;

      if (dir === "TOP") document.getElementById('opt_top').classList.add('active');
      if (dir === "RIGHT") document.getElementById('opt_right').classList.add('active');
      if (dir === "BOTTOM") document.getElementById('opt_bottom').classList.add('active');
      if (dir === "LEFT") document.getElementById('opt_left').classList.add('active');
    }

    function executeCommand(dir) {
      if (dir === "TOP") speakText("I need water.");
      if (dir === "RIGHT") speakText("I am experiencing pain.");
      if (dir === "BOTTOM") triggerEmergency();
      if (dir === "LEFT") speakText("Please adjust my bed position.");
    }

    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await faceMesh.send({image: videoElement}); },
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
