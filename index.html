<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraCare - Patient Assistive Interface</title>
    <!-- Google Fonts & Tailwind CSS for Professional Styling -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        medical: { 50: '#f0fdf4', 100: '#dcfce7', 600: '#16a34a', 700: '#15803d', 900: '#14532d' }
                    }
                }
            }
        }
    </script>
    <style>
        .dwell-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 6px;
            background-color: #3b82f6;
            width: 0%;
            transition: width linear;
        }
        .active-dwell .dwell-progress {
            width: 100%;
            transition-duration: 1.5s;
        }
        /* High contrast focus ring for accessibility */
        .gaze-target:focus, .gaze-target.hovered {
            outline: 4px solid #2563eb;
            transform: scale(1.02);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col justify-between select-none overflow-hidden">

    <!-- Top Navigation Bar / Status Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-8 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-4 h-4 rounded-full bg-emerald-500 animate-pulse"></div>
            <h1 class="text-xl font-bold tracking-wide text-white">AuraCare <span class="text-xs font-normal text-slate-400 bg-slate-700 px-2 py-1 rounded ml-2">Eye-Control Active</span></h1>
        </div>
        <div class="flex items-center space-x-6 text-sm text-slate-300">
            <div>Patient: <span class="font-semibold text-white">John Doe (Room 302-B)</span></div>
            <div id="clock" class="font-mono bg-slate-900 px-3 py-1 rounded border border-slate-700">00:00:00</div>
        </div>
    </header>

    <!-- Main Dynamic Screen Container -->
    <main id="main-container" class="flex-1 p-8 flex flex-col justify-center items-center relative">
        <!-- Dynamic content injected via JavaScript -->
    </main>

    <!-- Footer Guide Bar -->
    <footer class="bg-slate-800 border-t border-slate-700 px-8 py-3 text-center text-sm text-slate-400 flex justify-between items-center">
        <div>💡 <span class="text-slate-200 font-medium">Instruction:</span> Focus gaze / Hover on option for 1.5 seconds to select. Blink/Press Enter to confirm.</div>
        <div id="status-alert" class="text-emerald-400 font-medium">System operational. Tracking active.</div>
    </footer>

    <!-- Audio Element for Alarm -->
    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        // Real-time Clock
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        let dwellTimer = null;
        const audioAlarm = document.getElementById('alert-sound');

        // Render Main Screen Options
        function renderMainScreen() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="w-full max-w-5xl text-center mb-6">
                    <h2 class="text-3xl font-bold text-white mb-2">Select Your Need</h2>
                    <p class="text-slate-400">Gaze at any option below to select</p>
                </div>
                <div class="grid grid-cols-2 gap-8 w-full max-w-4xl h-[60vh]">
                    <!-- Option 1: Call Nurse -->
                    <div onclick="selectOption('nurse')" onmouseenter="startDwell(this, 'nurse')" onmouseleave="cancelDwell(this)" 
                         class="gaze-target relative overflow-hidden bg-slate-800 border-2 border-slate-700 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all duration-300 hover:border-blue-500 hover:bg-slate-750">
                        <div class="text-6xl mb-4">👩‍⚕️</div>
                        <h3 class="text-2xl font-bold text-white">Call Nurse</h3>
                        <p class="text-sm text-slate-400 mt-1">Notify nursing station & request assistance</p>
                        <div class="dwell-progress"></div>
                    </div>

                    <!-- Option 2: Adjust Bed Position -->
                    <div onclick="selectOption('bed')" onmouseenter="startDwell(this, 'bed')" onmouseleave="cancelDwell(this)" 
                         class="gaze-target relative overflow-hidden bg-slate-800 border-2 border-slate-700 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all duration-300 hover:border-blue-500 hover:bg-slate-750">
                        <div class="text-6xl mb-4">🛏️</div>
                        <h3 class="text-2xl font-bold text-white">Adjust Bed Position</h3>
                        <p class="text-sm text-slate-400 mt-1">Send position adjustment alert to family</p>
                        <div class="dwell-progress"></div>
                    </div>

                    <!-- Option 3: Bathroom -->
                    <div onclick="selectOption('bathroom')" onmouseenter="startDwell(this, 'bathroom')" onmouseleave="cancelDwell(this)" 
                         class="gaze-target relative overflow-hidden bg-slate-800 border-2 border-slate-700 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all duration-300 hover:border-red-500 hover:bg-slate-750">
                        <div class="text-6xl mb-4">🚻</div>
                        <h3 class="text-2xl font-bold text-white">Bathroom Emergency</h3>
                        <p class="text-sm text-slate-400 mt-1">Immediate distress alert to everyone</p>
                        <div class="dwell-progress"></div>
                    </div>

                    <!-- Option 4: Entertainment -->
                    <div onclick="selectOption('entertainment')" onmouseenter="startDwell(this, 'entertainment')" onmouseleave="cancelDwell(this)" 
                         class="gaze-target relative overflow-hidden bg-slate-800 border-2 border-slate-700 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition-all duration-300 hover:border-blue-500 hover:bg-slate-750">
                        <div class="text-6xl mb-4">📺</div>
                        <h3 class="text-2xl font-bold text-white">Entertainment</h3>
                        <p class="text-sm text-slate-400 mt-1">Watch TV, Movies, Social Media & More</p>
                        <div class="dwell-progress"></div>
                    </div>
                </div>
            `;
        }

        // Dwell Time Logic (Simulates eye resting on target)
        function startDwell(element, optionType) {
            element.classList.add('active-dwell', 'hovered');
            dwellTimer = setTimeout(() => {
                selectOption(optionType);
            }, 1500); // 1.5 seconds dwell time
        }

        function cancelDwell(element) {
            element.classList.remove('active-dwell', 'hovered');
            clearTimeout(dwellTimer);
        }

        // Handle Selection Routing
        function selectOption(type) {
            clearTimeout(dwellIntentCheck);
            clearTimeout(dwellTimer);
            if (type === 'nurse') {
                triggerNurseCall();
            } else if (type === 'bed') {
                triggerBedAlert();
            } else if (type === 'bathroom') {
                triggerBathroomEmergency();
            } else if (type === 'entertainment') {
                renderEntertainmentScreen();
            }
        }

        // 1. Nurse Call Flow
        function triggerNurseCall() {
            audioAlarm.loop = true;
            audioAlarm.play().catch(e => console.log("Audio autoplay restricted"));
            document.getElementById('status-alert').innerText = "⚠️ NURSE ALERT SENT to Phone (+1 555-0199) & Alarm Active";
            document.getElementById('status-alert').className = "text-red-400 font-bold animate-pulse";

            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-2xl w-full text-center shadow-2xl">
                    <div class="text-5xl mb-4">🚨</div>
                    <h2 class="text-3xl font-bold text-white mb-2">Nurse Called Successfully</h2>
                    <p class="text-slate-300 mb-6">Alarm is ringing on the speaker. Waiting for nurse confirmation...</p>
                    
                    <div class="bg-slate-900 p-4 rounded-xl mb-6 border border-slate-700">
                        <p class="text-sm text-slate-400 mb-2">Simulate Nurse Response:</p>
                        <button onclick="nurseAcceptedFlow()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2 rounded-lg transition">
                            Simulate [Nurse Accepted Call]
                        </button>
                    </div>

                    <button onclick="resetToHome()" class="text-slate-400 hover:text-white underline text-sm">Cancel / Return Home</button>
                </div>
            `;
        }

        // When Nurse Accepts - Show Yes/No & Call Doctor options
        let dwellIntentCheck = null;
        function nurseAcceptedFlow() {
            audioAlarm.pause();
            audioAlarm.currentTime = 0;
            document.getElementById('status-alert').innerText = "✅ Nurse Accepted Call. Select requirement:";
            
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="w-full max-w-4xl text-center mb-6">
                    <h2 class="text-3xl font-bold text-white mb-2">Nurse is Connected</h2>
                    <p class="text-slate-400">Select your quick response or escalate to Doctor</p>
                </div>
                <div class="grid grid-cols-3 gap-6 w-full max-w-3xl mb-8">
                    <div onclick="sendNurseResponse('YES')" onmouseenter="startDwell(this, 'res-yes')" onmouseleave="cancelDwell(this)" 
                         class="gaze-target bg-emerald-800 border-2 border-emerald-600 p-8 rounded-2xl flex flex-col items-center justify-center cursor-pointer relative overflow-hidden">
                        <span class="text-4xl mb-2">✅</span>
                        <h3 class="text-2xl font-bold text-white">YES</h3>
                        <div class="dwell-progress"></div>
                    </div>
                    <div onclick="sendNurseResponse('NO')" onmouseenter="startDwell(this, 'res-no')" onmouseleave="cancelDwell(this)" 
                         class="gaze-target bg-rose-800 border-2 border-rose-600 p-8 rounded-2xl flex flex-col items-center justify-center cursor-pointer relative overflow-hidden">
                        <span class="text-4xl mb-2">❌</span>
                        <h3 class="text-2xl font-bold text-white">NO</h3>
                        <div class="dwell-progress"></div>
                    </div>
                    <div onclick="sendNurseResponse('DOCTOR')" onmouseenter="startDwell(this, 'res-doc')" onmouseleave="cancelDwell(this)" 
                         class="gaze-target bg-blue-800 border-2 border-blue-600 p-8 rounded-2xl flex flex-col items-center justify-center cursor-pointer relative overflow-hidden">
                        <span class="text-4xl mb-2">👨‍⚕️</span>
                        <h3 class="text-xl font-bold text-white">Call Doctor</h3>
                        <div class="dwell-progress"></div>
                    </div>
                </div>
                <button onclick="resetToHome()" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-lg">Return to Main Menu</button>
            `;
        }

        function sendNurseResponse(ans) {
            alert(`Message sent to nurse terminal: Patient replied -> ${ans}`);
            resetToHome();
        }

        // 2. Adjust Bed Position Flow
        function triggerBedAlert() {
            audioAlarm.play();
            setTimeout(() => audioAlarm.pause(), 1000);
            document.getElementById('status-alert').innerText = "📱 Bed Adjustment Alert sent to all family members.";
            
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-xl w-full text-center shadow-2xl">
                    <div class="text-5xl mb-4">🛏️</div>
                    <h2 class="text-2xl font-bold text-white mb-2">Bed Position Request Sent</h2>
                    <p class="text-slate-300 mb-6">All registered family members have been notified via push alert.</p>
                    <button onclick="resetToHome()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-xl">Back to Home</button>
                </div>
            `;
        }

        // 3. Bathroom Emergency Flow
        function triggerBathroomEmergency() {
            audioAlarm.loop = true;
            audioAlarm.play();
            document.getElementById('status-alert').innerText = "🚨 EMERGENCY: Bathroom Assistance Requested!";
            document.getElementById('status-alert').className = "text-red-500 font-extrabold animate-bounce";

            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="bg-red-950 border-2 border-red-600 p-8 rounded-2xl max-w-xl w-full text-center shadow-2xl animate-pulse">
                    <div class="text-6xl mb-4">🚨</div>
                    <h2 class="text-3xl font-bold text-red-100 mb-2">BATHROOM EMERGENCY ALERT</h2>
                    <p class="text-red-200 mb-6">Urgent broadcast alert sent to Nursing Station and All Family Contacts.</p>
                    <button onclick="resetToHome()" class="bg-white text-red-900 font-bold px-8 py-3 rounded-xl hover:bg-slate-100 transition">Acknowledge & Clear Alarm</button>
                </div>
            `;
        }

        // 4. Entertainment Flow (4 Directional Options)
        function renderEntertainmentScreen() {
            document.getElementById('status-alert').innerText = "📺 Entertainment Menu Active";
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div class="w-full max-w-5xl text-center mb-4">
                    <h2 class="text-3xl font-bold text-white">Entertainment Center</h2>
                    <p class="text-slate-400 text-sm">Select media option</p>
                </div>
                <div class="relative w-full max-w-3xl h-[55vh] flex items-center justify-center">
                    <!-- Top Option -->
                    <div onclick="selectMedia('Watch TV')" onmouseenter="startDwell(this, 'tv')" onmouseleave="cancelDwell(this)"
                         class="gaze-target absolute top-0 left-1/2 -translate-x-1/2 bg-slate-800 border-2 border-slate-700 w-64 h-32 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-blue-500">
                        <span class="text-3xl">📺</span>
                        <span class="font-bold text-lg mt-1">Watch TV</span>
                        <div class="dwell-progress"></div>
                    </div>
                    <!-- Left Option -->
                    <div onclick="selectMedia('Watch Television / Movies')" onmouseenter="startDwell(this, 'movies')" onmouseleave="cancelDwell(this)"
                         class="gaze-target absolute left-0 top-1/2 -translate-y-1/2 bg-slate-800 border-2 border-slate-700 w-64 h-32 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-blue-500">
                        <span class="text-3xl">🍿</span>
                        <span class="font-bold text-lg mt-1">Watch Movies</span>
                        <div class="dwell-progress"></div>
                    </div>
                    <!-- Right Option -->
                    <div onclick="selectMedia('Open Instagram')" onmouseenter="startDwell(this, 'insta')" onmouseleave="cancelDwell(this)"
                         class="gaze-target absolute right-0 top-1/2 -translate-y-1/2 bg-slate-800 border-2 border-slate-700 w-64 h-32 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-pink-500">
                        <span class="text-3xl">📸</span>
                        <span class="font-bold text-lg mt-1">Open Instagram</span>
                        <div class="dwell-progress"></div>
                    </div>
                    <!-- Bottom Option -->
                    <div onclick="selectMedia('Listen to Music')" onmouseenter="startDwell(this, 'music')" onmouseleave="cancelDwell(this)"
                         class="gaze-target absolute bottom-0 left-1/2 -translate-x-1/2 bg-slate-800 border-2 border-slate-700 w-64 h-32 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-blue-500">
                        <span class="text-3xl">🎵</span>
                        <span class="font-bold text-lg mt-1">Listen to Music</span>
                        <div class="dwell-progress"></div>
                    </div>
                </div>
                <div class="mt-4">
                    <button onclick="resetToHome()" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-lg text-sm">Back to Main Menu</button>
                </div>
            `;
        }

        function selectMedia(mediaName) {
            alert(`Launching: ${mediaName}`);
            resetToHome();
        }

        function resetToHome() {
            audioAlarm.pause();
            audioAlarm.currentTime = 0;
            document.getElementById('status-alert').innerText = "System operational. Tracking active.";
            document.getElementById('status-alert').className = "text-emerald-400 font-medium";
            renderMainScreen();
        }

        // Initialize application view on load
        window.onload = renderMainScreen;
    </script>
</body>
</html>
